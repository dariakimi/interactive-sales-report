<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style>
<title>Hartwell Sales Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: sticky header with month and filters, then tabs; summary grid of tiles grouped by measure category; detail screen replaces the grid. */
:root{
 --bg:#f4f6f8; --surface:#ffffff; --surface-2:#edf1f5; --line:#dce2e9; --line-2:#c7d0da;
 --fg:#121820; --fg-2:#46505d; --fg-3:#6e7987;
 --accent:#1f5fa8; --accent-soft:#e3edf8;
 --s1:#2a78d6; --s2:#eb6834; --ly:#a6b0bc; --band:#e2e8ef; --band-edge:#c9d3de;
 --good:#0ca30c; --critical:#d03b3b; --good-soft:#e5f5e5; --critical-soft:#fbe9e9; --good-text:#0a7a1f; --critical-text:#c42b2b;
 --bar-hi:#1d5fb4; --bar-lo:#e07a2e; --bar-mut:#a9c3e3;
 --font-ui:"Instrument Sans",-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
 --font-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
 --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#101317; --surface:#181c21; --surface-2:#20252b; --line:#2b323a; --line-2:#3a434d;
 --fg:#eef1f4; --fg-2:#b5bec8; --fg-3:#8c96a2;
 --accent:#78aef0; --accent-soft:#1d2a3a;
 --s1:#3987e5; --s2:#d95926; --ly:#56606b; --band:#222b35; --band-edge:#33404d;
 --good:#0ca30c; --critical:#d03b3b; --good-soft:#15291a; --critical-soft:#33191a; --good-text:#4cc764; --critical-text:#f07070; --bar-hi:#5a9ff0; --bar-lo:#e0823d; --bar-mut:#2e4a6b; color-scheme:dark}}
:root[data-theme="dark"]{
 --bg:#101317; --surface:#181c21; --surface-2:#20252b; --line:#2b323a; --line-2:#3a434d;
 --fg:#eef1f4; --fg-2:#b5bec8; --fg-3:#8c96a2;
 --accent:#78aef0; --accent-soft:#1d2a3a;
 --s1:#3987e5; --s2:#d95926; --ly:#56606b; --band:#222b35; --band-edge:#33404d;
 --good:#0ca30c; --critical:#d03b3b; --good-soft:#15291a; --critical-soft:#33191a; --good-text:#4cc764; --critical-text:#f07070; --bar-hi:#5a9ff0; --bar-lo:#e0823d; --bar-mut:#2e4a6b; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:14px;line-height:1.45}
.wrap{max-width:1280px;margin:0 auto;padding-inline:20px;padding-block:0 48px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
button,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header.top{z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
@media (min-width:900px){header.top{position:sticky;top:env(safe-area-inset-top,0px)}}
.brand{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 16px;padding-block:14px 8px}
.brand h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.brand .co{font-size:13px;color:var(--fg-2)}
.sample{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2);border:1px solid var(--line-2);border-radius:4px;padding:1px 6px}
.closed{margin-left:auto;font-size:13px;color:var(--fg-2);display:flex;align-items:center;gap:6px}
.closed .lock{width:8px;height:8px;border-radius:2px;background:var(--fg-3)}
.filters{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end;padding-block:4px 12px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f label{font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3)}
.f select{background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:6px 28px 6px 9px;min-width:120px;max-width:220px;appearance:none;
 background-image:linear-gradient(45deg,transparent 50%,var(--fg-2) 50%),linear-gradient(135deg,var(--fg-2) 50%,transparent 50%);background-position:calc(100% - 14px) 52%,calc(100% - 9px) 52%;background-size:5px 5px;background-repeat:no-repeat}
.f select:disabled{opacity:.6}
.btn{background:var(--surface);border:1px solid var(--line-2);border-radius:7px;padding:6px 12px;cursor:pointer}
.btn:hover{background:var(--surface-2)}
.tabs{display:flex;gap:4px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px 9px;cursor:pointer;color:var(--fg-2);font-weight:500;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}

.intro{display:flex;flex-wrap:wrap;gap:8px 20px;align-items:center;padding-block:16px 4px;color:var(--fg-2);font-size:13px}
.key{display:inline-flex;align-items:center;gap:6px}
.key i{display:inline-block;width:18px;height:9px;background:var(--band);border:1px solid var(--band-edge);border-radius:2px}
.key b{display:inline-block;width:9px;height:9px;border-radius:50%}

section.grp{margin-top:22px}
.grp h2{margin:0 0 10px;font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-2);display:flex;gap:8px;align-items:baseline}
.grp h2 span{font-weight:400;letter-spacing:0;text-transform:none;color:var(--fg-3)}
.groups{display:flex;flex-wrap:wrap;gap:4px 28px;align-items:flex-start}
.groups section.grp{flex:0 1 auto;min-width:0;max-width:100%}
.tiles{display:flex;flex-wrap:wrap;gap:12px}
.tiles .tile{width:290px;max-width:100%}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 14px 12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;text-align:left;min-width:0}
.tile:hover{border-color:var(--line-2);box-shadow:0 1px 0 var(--line)}
.tile.out-bad{background:linear-gradient(var(--critical-soft),var(--surface) 70%)}
.tile.out-good{background:linear-gradient(var(--good-soft),var(--surface) 70%)}
.t-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.t-name{font-weight:600;font-size:14px;line-height:1.3}
.info{flex:none;width:18px;height:18px;border-radius:50%;border:1px solid var(--line-2);color:var(--fg-2);font-size:11px;font-weight:600;display:grid;place-items:center;cursor:help;font-style:normal}
.t-owner{font-size:12px;color:var(--fg-3)}
.t-val{font-family:var(--font-num);font-size:26px;font-weight:500;letter-spacing:-.02em;line-height:1.1}
.t-cmp{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:12px;color:var(--fg-2)}
.t-cmp b{font-family:var(--font-num);font-weight:500;color:var(--fg)}
.up,.t-cmp b.up{color:var(--good-text)} .dn,.t-cmp b.dn{color:var(--critical-text)} .q-val b{font-weight:500}
.spark{height:40px;width:100%}
.t-foot{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--fg-3);gap:8px}
.chip{font-family:var(--font-ui);display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--fg);border-radius:20px;padding:2px 9px 2px 7px;border:1px solid var(--line-2);background:var(--surface)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.chip.bad .dot{background:var(--critical)} .chip.good .dot{background:var(--good)}
.open-hint{color:var(--accent);font-weight:500}

/* detail */
.back{margin-top:16px}
.d-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;margin-top:14px}
.d-head h2{margin:2px 0 4px;font-size:24px;letter-spacing:-.01em;text-wrap:balance}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--fg-3)}
.d-def{color:var(--fg-2);max-width:68ch;margin:0}
.d-big{display:flex;gap:24px;flex-wrap:wrap}
.d-big div{display:flex;flex-direction:column}
.d-big .lab{font-size:12px;color:var(--fg-3)}
.d-big .v{font-family:var(--font-num);font-size:22px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-top:14px;min-width:0}
.panel h3{margin:0 0 4px;font-size:15px}
.panel .sub{margin:0 0 10px;color:var(--fg-3);font-size:12.5px}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
@media (max-width:860px){.cols{grid-template-columns:minmax(0,1fr)}}
.chart{position:relative;width:100%}
.chart svg{display:block;max-width:100%;height:auto}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--fg-2);margin-top:8px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw-line{width:16px;height:0;border-top:2px solid}
.sw-dash{width:16px;height:0;border-top:2px dashed}
.sw-bar{width:10px;height:10px;border-radius:2px}
.sw-band{width:16px;height:10px;background:var(--band);border:1px solid var(--band-edge);border-radius:2px}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;margin-bottom:10px;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:5px 11px;cursor:pointer;color:var(--fg-2);font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--fg);font-weight:600}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--fg-3);font-weight:600;text-align:left;padding:6px 10px;border-bottom:1px solid var(--line-2);white-space:nowrap}
td{padding:7px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td.r,th.r{text-align:right}
td.id{font-family:var(--font-num);color:var(--accent)}
.note{font-size:12px;color:var(--fg-3);margin-top:8px}
.action{border:1px solid var(--line-2);border-radius:var(--r);padding:14px 16px;margin-top:14px;background:var(--surface)}
.action dl{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;margin:8px 0 0}
.action dt{color:var(--fg-3);font-size:12px;text-transform:uppercase;letter-spacing:.05em;font-weight:600;padding-top:2px}
.action dd{margin:0}
.svgt{fill:var(--fg-3);font-family:var(--font-num);font-size:11px}
.svgl{fill:var(--fg-2);font-family:var(--font-ui);font-size:12px}
.svgv{fill:var(--fg);font-family:var(--font-num);font-size:11.5px}
.grid{stroke:var(--line);stroke-width:1}
.base{stroke:var(--line-2);stroke-width:1}
.bandr{fill:var(--band);stroke:var(--band-edge);stroke-width:1}
.ln{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.ln1{stroke:var(--s1)} .ln2{stroke:var(--s2)} .lnly{stroke:var(--ly)} .lntg{stroke:var(--fg-2);stroke-dasharray:5 4;stroke-width:1.5}
.ref{stroke:var(--fg-3);stroke-dasharray:3 3;stroke-width:1}
.bar1{fill:var(--s1)} .bar2{fill:var(--s2)} .barly{fill:var(--ly)} .barhi{fill:var(--bar-hi)} .barlo{fill:var(--bar-lo)} .barmut{fill:var(--bar-mut)}
.dot1{fill:var(--s1);stroke:var(--surface);stroke-width:2} .dot2{fill:var(--s2);stroke:var(--surface);stroke-width:2}
.dotbad{fill:var(--critical);stroke:var(--surface);stroke-width:2} .dotgood{fill:var(--good);stroke:var(--surface);stroke-width:2}
.tick{stroke:var(--fg);stroke-width:2}
.xh{stroke:var(--fg-3);stroke-width:1}
.hit{fill:transparent;cursor:crosshair}
.hitbar{fill:transparent;cursor:default}
.hitbar:hover+.bar1,.rowg:hover .bar1,.rowg:hover .barhi,.rowg:hover .barlo,.rowg:hover .barmut{opacity:.82}
#tip{position:fixed;z-index:50;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.14);max-width:300px}
#tip .tt{color:var(--fg-3);font-size:11.5px;margin-bottom:4px}
#tip .row{display:flex;align-items:center;gap:8px;justify-content:space-between}
#tip .row .k{display:flex;align-items:center;gap:6px;color:var(--fg-2)}
#tip .row .v{font-family:var(--font-num);font-weight:500;color:var(--fg)}
#tip .key{width:12px;border-top:2px solid}
#tip p{margin:0;color:var(--fg-2)}
#tip p+p{margin-top:5px}
.q-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(340px,100%),1fr));gap:14px}
.q-val{font-family:var(--font-num);font-size:20px}
.muted{color:var(--fg-3)}
@media (max-width:520px){.wrap{padding-inline:16px}.closed{margin-left:0;width:100%}.f select{min-width:0;max-width:100%}.f{flex:1 1 44%}.t-val{font-size:23px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<header class="top">
 <div class="wrap" style="padding-block:0">
  <div class="brand">
   <h1>Monthly sales dashboard</h1>
   <span class="co">Hartwell Flow Systems, a fictional pump and valve manufacturer</span>
   <span class="sample">Sample data</span>
   <span class="closed"><span class="lock" aria-hidden="true"></span><span id="closedTxt"></span></span>
  </div>
  <div class="filters" role="group" aria-label="Filters">
   <div class="f"><label for="fView">Viewing as</label><select id="fView"></select></div>
   <div class="f"><label for="fMonth">Month</label><select id="fMonth"></select></div>
   <div class="f"><label for="fRegion">Region</label><select id="fRegion"></select></div>
   <div class="f"><label for="fCat">Product category</label><select id="fCat"></select></div>
   <div class="f"><label for="fCust">Customer</label><select id="fCust"></select></div>
   <div class="f"><label for="fRep">Sales representative</label><select id="fRep"></select></div>
   <button class="btn" id="reset" type="button">Reset filters</button>
  </div>
  <nav class="tabs" role="tablist" aria-label="Dashboard pages">
   <button class="tab" role="tab" id="tab-monthly" data-tab="monthly">Monthly measures</button>
   <button class="tab" role="tab" id="tab-why" data-tab="why">Why it happened</button>
   <button class="tab" role="tab" id="tab-quarterly" data-tab="quarterly">Quarterly and annual review</button>
  </nav>
 </div>
</header>
<main class="wrap" id="main"></main>
<div id="tip" hidden></div>

<script>
/* ===== Data: CSV files in /data, loaded before the first render ===== */
const OFF = 3;                 // months before the first displayed month that still feed comparisons
const N = 39;                  // months in the dataset: Jul 2023 .. Sep 2026
const LAST = N - 1;            // Sep 2026
const FIRST_SEL = OFF + 24;    // first month with 24 months of history before it

const DAY0 = Date.UTC(2023,6,1);
const MS = []; for(let m=0;m<=N;m++) MS.push(Math.round((Date.UTC(2023,6+m,1)-DAY0)/864e5));
const endDay = m => MS[m+1]-1;
function monthOf(d){ if(d<0) return -1; let lo=0,hi=N; while(lo<hi){const mid=(lo+hi+1)>>1; if(MS[mid]<=d) lo=mid; else hi=mid-1;} return lo; }
function monthLabel(m,short){const d=new Date(Date.UTC(2023,6+m,1));const mo=d.toLocaleString('en-US',{month:'short',timeZone:'UTC'});return short?mo+" '"+String(d.getUTCFullYear()).slice(2):mo+' '+d.getUTCFullYear();}
function monthLong(m){const d=new Date(Date.UTC(2023,6+m,1));return d.toLocaleString('en-US',{month:'long',year:'numeric',timeZone:'UTC'});}
function dayLabel(d){const x=new Date(DAY0+d*864e5);return x.toLocaleString('en-US',{month:'short',day:'numeric',year:'numeric',timeZone:'UTC'});}
const dayOf = s => s ? Math.round((Date.parse(s)-DAY0)/864e5) : null;

const REGIONS = [], REPS = [], CATS = [], CUSTOMERS = [], QUOTES = [];
const TARGET = {}, FCAST = {}, QDATA = {measures:[], funnel:[]};

function parseCSV(text){
 const [head,...lines] = text.trim().split(/\r?\n/); const keys = head.split(',');
 return lines.map(l => { const c = l.split(','); const o = {}; keys.forEach((k,i)=>o[k]=c[i]??''); return o; });
}
const DATA = Promise.all(['sales_reps','customers','quotes','targets_and_forecasts','quarterly_measures','sales_funnel']
 .map(n => fetch('data/'+n+'.csv').then(r => { if(!r.ok) throw new Error(n+'.csv: '+r.status); return r.text(); }).then(parseCSV)))
 .then(([reps,custs,quotes,tf,qm,fun]) => {
  reps.forEach(r => { REPS.push({name:r.sales_rep,region:r.region}); if(!REGIONS.includes(r.region)) REGIONS.push(r.region); });
  custs.forEach(c => CUSTOMERS.push({name:c.customer,region:c.region,rep:c.sales_rep,interval:1}));
  tf.forEach(r => { if(!CATS.includes(r.product_category)) CATS.push(r.product_category); });
  REPS.forEach(r => { TARGET[r.name]={}; FCAST[r.name]={}; CATS.forEach(c => { TARGET[r.name][c]=new Array(N).fill(0); FCAST[r.name][c]=new Array(N).fill(0); }); });
  tf.forEach(r => { const m = monthOf(dayOf(r.month+'-01')); TARGET[r.sales_rep][r.product_category][m] = +r.revenue_target; FCAST[r.sales_rep][r.product_category][m] = +r.revenue_forecast; });
  quotes.forEach(r => {
   const inq = dayOf(r.inquiry_date), iss = dayOf(r.quote_sent_date);
   const q = {id:r.quote_id, m:monthOf(inq), cust:r.customer, region:r.region, rep:r.sales_rep, cat:r.product_category, value:+r.quote_value,
    inq, tat:+r.turnaround_days, iss, im:monthOf(iss), valid:dayOf(r.valid_until), cause:r.delay_cause, status:r.status};
   if(r.decision_date){ q.dd = dayOf(r.decision_date); q.dm = monthOf(q.dd); }
   if(r.won_reason) q.wonR = r.won_reason;
   if(r.lost_reason) q.lostR = r.lost_reason;
   if(r.order_id){ const inv = dayOf(r.invoice_date);
    q.order = {id:r.order_id, day:q.dd, inv, invM: inv==null?null:monthOf(inv), value:q.value, margin:+r.gross_margin,
     returned:r.returned==='yes', resp:r.survey_answered==='yes', sat:r.satisfied==='yes'}; }
   QUOTES.push(q);
  });
  QDATA.measures = qm; QDATA.funnel = fun;
 });

/* ===== aggregation ===== */
function match(q,f){return (!f.region||q.region===f.region)&&(!f.cat||q.cat===f.cat)&&(!f.cust||q.cust===f.cust)&&(!f.rep||q.rep===f.rep);}
function z(){return new Array(N).fill(0);}
function agg(f){
 const S={rev:z(),cost:z(),orders:z(),returned:z(),issued:z(),recv:z(),lostCnt:z(),lostVal:z(),agingCnt:z(),agingVal:z(),
  csR:z(),csS:z(),turn:Array.from({length:N},()=>[]),target:z(),fc:z(),lapsed:z(),
  lostR:Array.from({length:N},()=>({})),wonR:Array.from({length:N},()=>({})),delay:Array.from({length:N},()=>({}))};
 const ordM={};
 for(const q of QUOTES){
  if(!match(q,f)) continue;
  S.issued[q.im]++; S.turn[q.im].push(q.tat);
  if(q.status==='won'){S.recv[q.dm]++; const o=S.wonR[q.dm]; o[q.wonR]=o[q.wonR]||{n:0,v:0}; o[q.wonR].n++; o[q.wonR].v+=q.value;
   (ordM[q.cust]=ordM[q.cust]||[]).push(q.dm);}
  if(q.status==='lost'){S.lostCnt[q.dm]++; S.lostVal[q.dm]+=q.value; const o=S.lostR[q.dm]; o[q.lostR]=o[q.lostR]||{n:0,v:0}; o[q.lostR].n++; o[q.lostR].v+=q.value;}
  const vm=monthOf(q.valid); const until = q.status==='open'?LAST:q.dm-1;
  for(let m=Math.max(vm,0); m<=until && m<N; m++){ if(q.valid>endDay(m)) continue; S.agingCnt[m]++; S.agingVal[m]+=q.value; const d=S.delay[m]; d[q.cause]=(d[q.cause]||0)+(endDay(m)-q.iss);}
  const o=q.order; if(o&&o.invM!=null){S.rev[o.invM]+=o.value; S.cost[o.invM]+=o.value*(1-o.margin); S.orders[o.invM]++; if(o.returned)S.returned[o.invM]++; if(o.resp){S.csR[o.invM]++; if(o.sat)S.csS[o.invM]++;}}
 }
 S.hasTarget = !f.cust;
 if(!f.cust){ REPS.forEach(r=>{ if(f.rep&&r.name!==f.rep) return; if(f.region&&r.region!==f.region) return;
  CATS.forEach(c=>{ if(f.cat&&c!==f.cat) return; for(let m=0;m<N;m++){S.target[m]+=TARGET[r.name][c][m]; S.fc[m]+=FCAST[r.name][c][m];}});});}
 CUSTOMERS.forEach(c=>{ if((f.region&&c.region!==f.region)||(f.rep&&c.rep!==f.rep)||(f.cust&&c.name!==f.cust)) return;
  const om=(ordM[c.name]||[]).slice().sort((a,b)=>a-b); const lim=Math.ceil(1.5*c.interval)+1;

function spark(el,vals,b,st){
 const W=Math.max(120,el.clientWidth), H=40, P=5; const v=vals.filter(x=>x!=null&&!isNaN(x)); if(!v.length){el.innerHTML='';return;}
 let mn=Math.min(...v), mx=Math.max(...v); if(b){mn=Math.min(mn,b.lo);mx=Math.max(mx,b.hi);} if(mn===mx){mn-=1;mx+=1;}
 const y=x=>P+(H-2*P)-(x-mn)/(mx-mn)*(H-2*P), x=i=>P+i*(W-2*P)/(vals.length-1);
 let d='',pen=false; vals.forEach((q,i)=>{if(q==null||isNaN(q)){pen=false;return;} d+=(pen?'L':'M')+x(i).toFixed(1)+','+y(q).toFixed(1)+' '; pen=true;});
 const li=vals.length-1; const dc=st?(st.good?'dotgood':'dotbad'):'dot1';
 el.innerHTML=`<svg width="${W}" height="${H}" aria-hidden="true">${b?`<rect class="bandr" x="0" width="${W}" y="${y(b.hi)}" height="${Math.max(1,y(b.lo)-y(b.hi))}" rx="2"/>`:''}<path class="ln ln1" d="${d}"/>${vals[li]!=null?`<circle class="${dc}" cx="${x(li)}" cy="${y(vals[li])}" r="4"/>`:''}</svg>`;
}

function opts(sel,items,val){ sel.innerHTML=''; items.forEach(([v,t])=>{const o=document.createElement('option');o.value=v;o.textContent=t;if(v===val)o.selected=true;sel.appendChild(o);}); }

 const ms=[]; for(let m=LAST;m>=FIRST_SEL;m--) ms.push([String(m),monthLong(m)]); opts($('fMonth'),ms,String(st.s));
 const f=filt();
 opts($('fRegion'),[['','All regions'],...REGIONS.map(x=>[x,x])],f.region||''); $('fRegion').disabled=r.kind!=='vp';
 opts($('fCat'),[['','All categories'],...CATS.map(x=>[x,x])],st.cat);
 const reps=REPS.filter(x=>!f.region||x.region===f.region); opts($('fRep'),[['','All representatives'],...reps.map(x=>[x.name,x.name])],f.rep||''); $('fRep').disabled=r.kind==='rep';
 const cs=CUSTOMERS.filter(c=>(!f.region||c.region===f.region)&&(!f.rep||c.rep===f.rep)).map(c=>c.name).sort(); if(st.cust&&!cs.includes(st.cust)) st.cust='';
 opts($('fCust'),[['','All customers'],...cs.map(x=>[x,x])],st.cust);
 $('closedTxt').textContent='Month closed: '+monthLong(st.s)+'. Figures frozen at close.';

}

$('fRegion').addEventListener('change',e=>{st.region=e.target.value; if(st.rep&&REPS.find(x=>x.name===st.rep).region!==st.region&&st.region) st.rep=''; render();});
$('fCat').addEventListener('change',e=>{st.cat=e.target.value; render();});
$('fCust').addEventListener('change',e=>{st.cust=e.target.value; render();});
$('fRep').addEventListener('change',e=>{st.rep=e.target.value; render();});

function teamMedian(ms){ const f=filt(); const vals=REPS.map(r=>ms.v(A({...f,region:'',rep:r.name,cust:''}),st.s)).filter(v=>v!=null&&!isNaN(v)); return median(vals); }

 const f=filt(), S=A(f), s=st.s, r=role();

 main.insertAdjacentHTML('beforeend',`<div class="intro"><span>Showing <b>${esc(scope)}</b> for <b>${esc(monthLong(s))}</b>. Click a measure to open it.</span>
  <span class="key"><i></i>Normal range, average ±2 standard deviations of the previous 24 months</span>

  <span class="key"><span class="up num">+2%</span><span class="dn num">-2%</span>Change in a good or bad direction for the measure</span></div>`);

/* ===================== records ===================== */
function records(ms,f,s){
 const q=QUOTES.filter(x=>match(x,f));
 if(ms.rec==='orders'){ const o=q.filter(x=>x.order&&x.order.invM===s).sort((a,b)=>b.value-a.value);
  return {title:'Orders invoiced in '+monthLong(s),n:o.length,head:['Order','Customer','Sales rep','Category','Value','Margin','Returned'],r:['','','','','r','r',''],
   rows:o.map(x=>[x.order.id,x.cust,x.rep,x.cat,F.usd(x.value),F.pct(x.order.margin),x.order.returned?'Yes':'No']),
   sortNote: ms.id==='ret'?o.filter(x=>x.order.returned).length+' returned orders listed first':null, pre: ms.id==='ret'?(rows=>rows.sort((a,b)=>(b[6]==='Yes')-(a[6]==='Yes'))):null}; }
 if(ms.rec==='quotes'){ const o=q.filter(x=>x.im===s).sort((a,b)=>b.value-a.value);
  return {title:'Quotes issued in '+monthLong(s),n:o.length,head:['Quote','Customer','Sales rep','Category','Value','Status'],r:['','','','','r',''],
   rows:o.map(x=>[x.id,x.cust,x.rep,x.cat,F.usd(x.value),x.status==='won'?'Won':x.status==='lost'?'Lost: '+x.lostR:'Open'])}; }
 if(ms.rec==='tat'){ const o=q.filter(x=>x.im===s).sort((a,b)=>b.tat-a.tat);
  return {title:'Quotes sent in '+monthLong(s)+', slowest first',n:o.length,head:['Quote','Customer','Category','Sales rep','Turnaround','Value'],r:['','','','','r','r'],
   rows:o.map(x=>[x.id,x.cust,x.cat,x.rep,F.days(x.tat),F.usd(x.value)])}; }
 if(ms.rec==='aging'){ const e=endDay(s); const o=q.filter(x=>x.valid<=e&&x.iss<=e&&(x.status==='open'||x.dd>e)).sort((a,b)=>b.value-a.value);
  return {title:'Aging open quotes at the end of '+monthLong(s)+', largest first',n:o.length,head:['Quote','Customer','Sales rep','Value','Days past validity','Cause of delay'],r:['','','','r','r',''],
   rows:o.map(x=>[x.id,x.cust,x.rep,F.usd(x.value),String(e-x.valid),x.cause])}; }
 if(ms.rec==='lapsed'){ const S=A(f); const rows=[];
  CUSTOMERS.forEach(c=>{ if((f.region&&c.region!==f.region)||(f.rep&&c.rep!==f.rep)||(f.cust&&c.name!==f.cust)) return; const om=(S.ordM[c.name]||[]).filter(m=>m<=s).sort((a,b)=>a-b);
   const lim=Math.ceil(1.5*c.interval)+1; if(om.length>=2 && s-om[om.length-1]>lim){ const rv=q.filter(x=>x.cust===c.name&&x.order&&x.order.invM!=null&&x.order.invM<=s&&x.order.invM>s-12).reduce((a,x)=>a+x.value,0);
    rows.push([c.name,c.region,c.rep,monthLong(om[om.length-1]),'Monthly',F.usd(rv),rv]); } });
  rows.sort((a,b)=>b[6]-a[6]);
  return {title:'Lapsed customers at the end of '+monthLong(s)+', by revenue in the previous 12 months',n:rows.length,head:['Customer','Region','Sales rep','Last order','Usual reorder interval','Revenue, previous 12 months'],r:['','','','','','r'],rows:rows.map(x=>x.slice(0,6)),noid:true}; }
}
function tableHTML(R,limit=15){
 if(R.pre) R.pre(R.rows);
 const rows=R.rows.slice(0,limit);
 return `<div class="tbl-wrap"><table><thead><tr>${R.head.map((h,i)=>`<th class="${R.r[i]}">${esc(h)}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(r=>`<tr>${r.map((c,i)=>`<td class="${R.r[i]} ${i===0&&!R.noid?'id':''}">${esc(c)}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${R.head.length}" class="muted">Nothing to list for this selection.</td></tr>`}</tbody></table></div>
  <div class="note">Showing ${Math.min(limit,R.n)} of ${R.n}. In the live dashboard each row opens the record in the order system.</div>`;
}

 else if(ms.id==='growth'){ series=[{name:'Last 3 months vs a year earlier',vals,cls:'ln1',color:'--s1',endDot},{name:'Single month vs a year earlier',vals:ms13.map(m=>div(S.rev[m],S.rev[m-12])-1),cls:'ln2',color:'--s2'}]; o.ref=0;

  lg('sw-line','Actual revenue','var(--s1)'); lg('sw-line','Forecast','var(--s2)'); }
 else if(ms.id==='aging'){ series=[{name:'Aging open quotes',vals,kind:'bar',cls:'bar1',color:'--s1'},{name:'Lost quotes',vals:ms13.map(m=>S.lostVal[m]),cls:'ln2',color:'--s2'}];

 else if(ms.id==='lapsed'){ series=[{name:'Lapsed customers',vals,kind:'bar',cls:'bar1',color:'--s1'}]; o.ax=F.daysAx; lg('sw-bar','Lapsed customers','var(--bar-mut)'); }

 if(o.band) lg('sw-band','Normal range');
 o.series=series; $('lg1').innerHTML=L.join('');
 const draws=[()=>trend($('c1'),o)];
 if(ms.id==='fc' && S.hasTarget){ $('c2wrap').innerHTML=`<div class="panel"><h3>Actual revenue in percent of forecast</h3><p class="sub">100% means the forecast was exact. Above 100% the team under-forecast; below 100% it over-forecast.</p><div class="chart" id="c2"></div><div class="legend"><span><span class="sw-line" style="border-top-color:var(--s1)"></span>Actual in percent of forecast</span><span><span class="sw-band"></span>Normal range</span></div></div>`;

/* ===================== why it happened ===================== */
function renderWhy(main){
 const f=filt(), S=A(f), s=st.s; const ms13=[]; for(let m=s-12;m<=s;m++) ms13.push(m);
 const win=[s-2,s-1,s]; const sum=(arr)=>{const o={}; win.forEach(m=>Object.entries(arr[m]).forEach(([k,v])=>{o[k]=o[k]||{n:0,v:0}; o[k].n+=v.n; o[k].v+=v.v;})); return o;};
 const lost=sum(S.lostR), won=sum(S.wonR);
 const csat=ms13.map(m=>div(S.csS[m],S.csR[m])); const qavg=ms13.map(m=>{const q0=m-((6+m)%3); let a=0,b=0; for(let k=q0;k<=Math.min(q0+2,s);k++){a+=S.csS[k];b+=S.csR[k];} return div(a,b);});
 const del=S.delay[s]; const dTot=Object.values(del).reduce((a,b)=>a+b,0);
 main.insertAdjacentHTML('beforeend',`<div class="intro"><span>The qualitative measures explain the numbers on the monthly page. Reasons are recorded on every quote and counted over the three months ending ${esc(monthLong(s))}, so each reason has enough cases to show a pattern.</span></div>
 <div class="panel"><h3>Customer satisfaction rate</h3><p class="sub">Share of surveyed customers who rated their order satisfied. Tracked monthly; the quarterly average is the figure to judge.</p><div class="chart" id="w1"></div>
 <div class="legend"><span><span class="sw-line" style="border-top-color:var(--s1)"></span>Monthly</span><span><span class="sw-line" style="border-top-color:var(--s2)"></span>Quarter to date average</span></div></div>
 <div class="seg" id="pm" style="margin-top:16px"><button type="button" data-p="n" aria-pressed="${st.pmode==='n'}">By number of quotes</button><button type="button" data-p="v" aria-pressed="${st.pmode==='v'}">By value</button></div>
 <div class="cols" style="margin-top:0"><div class="panel" style="margin-top:0"><h3>Reasons for lost quotes</h3><p class="sub">${esc(monthLong(s-2))} to ${esc(monthLong(s))}. Sorted largest first, with the cumulative share.</p><div class="chart" id="w2"></div></div>
 <div class="panel" style="margin-top:0"><h3>Reasons for won deals</h3><p class="sub">${esc(monthLong(s-2))} to ${esc(monthLong(s))}. Sorted largest first, with the cumulative share.</p><div class="chart" id="w3"></div></div></div>
 <div class="panel"><h3>Cause of delay for aging open quotes</h3><p class="sub">Share of the days that open quotes past their validity date had been waiting at the end of ${esc(monthLong(s))}. Customer delays sit apart from delays inside the company.</p><div class="chart" id="w4"></div></div>`);
 $('pm').querySelectorAll('button').forEach(b=>b.addEventListener('click',()=>{st.pmode=b.dataset.p;render();}));
 const par=(o)=>{const k=st.pmode; const rows=Object.entries(o).map(([l,x])=>({label:l,value:x[k],n:x.n,v:x.v})).sort((a,b)=>b.value-a.value); const tot=rows.reduce((a,b)=>a+b.value,0); let c=0;
  rows.forEach(r=>{c+=r.value; const cum=Math.round(c/tot*100); r.note='cum. '+cum+'%'; r.tip=t=>{tipRow(t,'Quotes',F.int(r.n));tipRow(t,'Value',F.usd(r.v));tipRow(t,'Cumulative share',cum+'%');};}); return rows;};
 const fmtP=st.pmode==='n'?F.int:F.usd, axP=st.pmode==='n'?F.daysAx:F.usdAx;
 const draws=[()=>trend($('w1'),{labels:ms13.map(m=>monthLabel(m,1)),full:ms13.map(m=>monthLong(m)),fmt:F.pct,ax:F.pctAx,h:220,series:[{name:'Monthly',vals:csat,cls:'ln1',color:'--s1',endDot:'dot1'},{name:'Quarter to date average',vals:qavg,cls:'ln2',color:'--s2'}],
   extra:(t,i)=>tipRow(t,'Survey responses',F.int(S.csR[ms13[i]]))}),
  ()=>hbars($('w2'),par(lost),{fmt:fmtP,ax:axP,vw:150,vname:st.pmode==='n'?'Lost quotes':'Value lost'}),
  ()=>hbars($('w3'),par(won),{fmt:fmtP,ax:axP,vw:150,vname:st.pmode==='n'?'Won deals':'Value won'}),
  ()=>hbars($('w4'),Object.entries(del).map(([l,d])=>({label:l,value:d/dTot})).sort((a,b)=>b.value-a.value),{fmt:F.pct,ax:F.pctAx,vname:'Share of waiting days'})];
 main._draws=draws; draws.forEach(d=>d());
}

/* ===================== quarterly and annual ===================== */
const QS=[]; for(let m=OFF+12;m<=LAST;m+=3) QS.push(m); // quarter start months: Oct 2024 .. Jul 2026
const QL=QS.map(m=>{const d=new Date(Date.UTC(2023,6+m,1));return 'Q'+(Math.floor(d.getUTCMonth()/3)+1)+" '"+String(d.getUTCFullYear()).slice(2);});
const QFULL=QS.map((m,i)=>QL[i].replace("'",'20'));
function quarterly(){
 const S=A({}); const cs=QS.map(q=>div(S.csS[q]+S.csS[q+1]+S.csS[q+2],S.csR[q]+S.csR[q+1]+S.csR[q+2]));
 const cyc=QS.map(q=>{const d=QUOTES.filter(x=>x.status==='won'&&x.dm>=q&&x.dm<=q+2).map(x=>x.dd-x.inq); return d.reduce((a,b)=>a+b,0)/d.length;});
 const qcol=k=>QL.map(l=>{const r=QDATA.measures.find(x=>x.quarter.slice(-2)+" '"+x.quarter.slice(2,4)===l); return r&&r[k]!==''?+r[k]:null;});
 return [
  {id:'csf',name:'Cost of sales function as a percentage of revenue',owner:'Provided by finance',fmt:F.pct,ax:F.pctAx,vals:qcol('cost_of_sales_pct'),pol:-1,def:'Salaries, commissions, bonuses, travel and sales software, divided by revenue.'},
  {id:'cret',name:'Customer retention rate',owner:'Sam Okafor, key account manager',fmt:F.pct,ax:F.pctAx,vals:qcol('customer_retention'),pol:1,def:'Customers who ordered in the same quarter last year and ordered again this quarter.'},
  {id:'csat',name:'Customer satisfaction rate',owner:'Rita Alvarez, customer service manager',fmt:F.pct,ax:F.pctAx,vals:cs,pol:1,def:'Quarterly average of the monthly survey, from the order data on this dashboard.'},
  {id:'turn',name:'Sales team employee turnover',owner:'Mark Ellison with human resources',fmt:F.pct,ax:F.pctAx,vals:qcol('sales_team_turnover'),pol:-1,def:'Leavers in the last 12 months divided by the average sales team headcount of 12.'},
  {id:'cyc',name:'Average sales cycle',owner:'Priya Nair, sales operations manager',fmt:F.days,ax:F.daysAx,vals:cyc,pol:-1,ref:42,refName:'Industry reference (sample)',def:'Average days from customer inquiry to purchase order for orders received in the quarter. Compared once a year with the industry reference.'},
  {id:'win',name:'Win rate',owner:'Laura Chen, inside sales manager',fmt:F.pct,ax:F.pctAx,vals:qcol('win_rate'),pol:1,def:'Share of qualified opportunities that ended as won deals.'}];
}
function renderQuarterly(main){
 const Q=quarterly();
 main.insertAdjacentHTML('beforeend',`<div class="intro"><span>These measures change slowly, so they are reviewed each quarter and once a year. Company-wide figures for the last eight quarters; the filters above do not apply here.</span></div><div class="q-grid" id="qg"></div>
 <div class="panel"><h3>Conversion rate between stages of the sales process</h3><p class="sub">Opportunities in ${esc(QFULL[7])}, with the share that moved on to the next stage.</p><div class="chart" id="fun"></div></div>`);
 const qg=$('qg'); const draws=[];
 Q.forEach((q,i)=>{ const last=q.vals[7], prev=q.vals[3]; const p=document.createElement('div'); p.className='panel'; p.style.marginTop='0';
  const dlt = q.fmt===F.days? F.sgnDays(last-prev): F.pts(last-prev);
  p.innerHTML=`<h3>${esc(q.name)}</h3><p class="sub">${esc(q.def)} Owner: ${esc(q.owner)}.</p><div class="q-val">${esc(q.fmt(last))} <span class="muted" style="font-size:13px">${esc(QFULL[7])}, <b class="${tone(last-prev,dlt,q.pol)}">${esc(dlt)}</b> vs ${esc(QFULL[3])}</span></div><div class="chart" id="q${i}" style="margin-top:6px"></div>${q.ref?`<div class="legend"><span><span class="sw-line" style="border-top-color:var(--s1)"></span>Average sales cycle</span><span><span class="sw-dash" style="border-top-color:var(--fg-3)"></span>${esc(q.refName)}, ${q.ref} days</span></div>`:''}`;
  qg.appendChild(p);
  draws.push(()=>trend($('q'+i),{labels:QL,full:QFULL,fmt:q.fmt,ax:q.ax,h:170,L:50,ref:q.ref??null,zero:q.id==='turn',series:[{name:q.name,vals:q.vals,kind:q.id==='turn'?'bar':'line',cls:q.id==='turn'?'bar1':'ln1',color:'--s1',endDot:'dot1'}],
   extra:q.ref?(t)=>tipRow(t,q.refName,q.ref+' days'):null})); });
 const stages=QDATA.funnel.map(r=>[r.stage,+r.opportunities]);
 const rows=stages.map(([l,n],i)=>({label:l,value:n,note:i?Math.round(n/stages[i-1][1]*100)+'% of previous':'', tip:t=>{if(i)tipRow(t,'Moved on from previous stage',Math.round(n/stages[i-1][1]*100)+'%');}}));
 draws.push(()=>hbars($('fun'),rows,{fmt:F.int,ax:F.daysAx,vw:170,vname:'Opportunities'}));
 main._draws=draws; draws.forEach(d=>d());
}

/* ===================== render ===================== */
function render(){
 hideTip(); buildFilters(); const main=$('main'); main.innerHTML=''; main._draws=null;
 if(st.tab==='monthly'){ if(st.detail) renderDetail(main); else renderSummary(main); }
 else if(st.tab==='why') renderWhy(main); else renderQuarterly(main);
}
let rz; addEventListener('resize',()=>{clearTimeout(rz); rz=setTimeout(()=>{const main=$('main'); if(main._draws) main._draws.forEach(d=>d()); main.querySelectorAll('.tile').forEach(t=>t._draw&&t._draw());},150);});
$('main').innerHTML='<p class="intro">Loading data…</p>';
DATA.then(render).catch(e=>{ $('main').innerHTML=`<p class="intro">The data files could not be loaded (${esc(e.message)}).</p>`; });
</script>
